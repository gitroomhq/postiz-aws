name: ops-image

# Builds the migration toolbox (docker/ops.Dockerfile) used by the "ops" task.
# Started by hand with a code from the authenticator, like a deploy: it pushes
# with the deploy role, which only the deploy gate hands out (README "Deploy gate").
on:
  workflow_dispatch:
    inputs:
      otp:
        description: 6-digit code from the authenticator
        required: true

permissions:
  contents: read
  id-token: write

env:
  # Not used by the steps: referencing the secret makes the public logs print ***
  # for the account id (ECR registry).
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  DEPLOY_GATE_URL: ${{ vars.DEPLOY_GATE_URL }}
  AWS_REGION: us-east-2

jobs:
  # First and fast: a code is good for about a minute.
  authorize:
    runs-on: ubuntu-24.04
    environment: deploy
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: show the code to the deploy gate
        run: scripts/gate-ci.sh open

  build:
    needs: authorize
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-24.04-arm' }}
    environment: deploy
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: aws credentials from the deploy gate
        run: scripts/gate-ci.sh login

      - name: ecr login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ops.Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/postiz-ops:latest
