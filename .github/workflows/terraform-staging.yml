name: terraform-staging

# environments/staging, in the staging account (docs/staging.md).
# Pull requests: fmt, validate and the offline test (mocked providers, no
# credentials); a plan with the read-only role too once the repository variable
# STAGING_AWS_PLAN_ROLE_ARN is set.
# Apply: started by hand on main, in the "staging-terraform" GitHub environment
# (limited to main in the repository settings). No code from the authenticator,
# unlike production: these roles reach only the staging account.

on:
  pull_request:
    paths:
      - "environments/staging/**"
      - "modules/**"
      - ".github/workflows/terraform-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-staging
  cancel-in-progress: false

# Account-specific values live in the repository settings:
#   variables STAGING_TF_STATE_BUCKET, STAGING_AWS_PLAN_ROLE_ARN, STAGING_AWS_APPLY_ROLE_ARN
#   secrets STAGING_AWS_ACCOUNT_ID, STAGING_CLOUDFLARE_API_TOKEN (getpostiz.com only),
#   ALERT_EMAILS (shared with production), STAGING_SES_RECIPIENTS (HCL list, optional)
env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.17.0"
  AWS_REGION: us-east-2
  WORKDIR: environments/staging
  CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
  TF_VAR_aws_account_id: ${{ secrets.STAGING_AWS_ACCOUNT_ID }}
  TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS || '[]' }}
  TF_VAR_ses_test_recipients: ${{ secrets.STAGING_SES_RECIPIENTS || '[]' }}
  TF_STATE_BUCKET: ${{ vars.STAGING_TF_STATE_BUCKET }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform -chdir=$WORKDIR init -backend=false -input=false

      - name: validate
        run: terraform -chdir=$WORKDIR validate -no-color

      - name: offline plan test (mocked providers)
        run: terraform -chdir=$WORKDIR test -no-color

  plan:
    needs: check
    if: github.event_name == 'pull_request' && vars.STAGING_AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: init
        run: terraform -chdir=$WORKDIR init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: plan
        id: plan
        run: |
          set -o pipefail
          # -refresh=false: the read-only role cannot read secret values
          terraform -chdir=$WORKDIR plan -refresh=false -input=false -lock-timeout=5m -no-color -out=tfplan | tee plan.txt

      # The repository is public: the comment carries only the summary line
      - name: comment plan
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : '';
            const summary = (plan.match(/^(Plan:|No changes\.).*$/m) || ['plan failed, see the job log'])[0];
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `### terraform plan (staging): ${summary}\n\n[Full plan in the job log](${run})` });

  apply:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging-terraform
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.STAGING_AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600

      - name: init
        run: terraform -chdir=$WORKDIR init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      - name: plan
        run: terraform -chdir=$WORKDIR plan -input=false -lock-timeout=5m -no-color -out=tfplan

      - name: apply
        run: terraform -chdir=$WORKDIR apply -input=false -lock-timeout=5m -no-color tfplan
